apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudops-redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cloudops

  source:
    repoURL: https://github.com/yourusername/cloudops.git
    targetRevision: main
    path: helm/redis
    helm:
      releaseName: cloudops-redis
      values: |
        redis:
          master:
            persistence:
              enabled: true
              size: 20Gi
          replica:
            replicaCount: 2
            persistence:
              enabled: true
              size: 20Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
