apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: automation-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cloudops

  source:
    repoURL: https://github.com/yourusername/cloudops.git
    targetRevision: main
    path: helm/automation-service
    helm:
      releaseName: automation-service
      values: |
        replicaCount: 2
        image:
          repository: cloudops/automation-service
          tag: "1.0.0"
        redis:
          enabled: false
        env:
          - name: REDIS_HOST
            value: "cloudops-redis-master"
          - name: REDIS_PORT
            value: "6379"

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
