name: Security-Enhanced Frontend CI/CD

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '18'
      registry:
        required: false
        type: string
        default: 'ghcr.io'
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_TOKEN:
        required: false
      SLACK_WEBHOOK:
        required: false

jobs:
  # Stage 2: Validate
  validate:
    name: Validate Code & Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          echo "Validating commit messages..."
          git log --format=%s origin/main..HEAD | while read msg; do
            if ! echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?: .+'; then
              echo "❌ Invalid commit message: $msg"
              exit 1
            else
              echo "✓ Valid: $msg"
            fi
          done
        continue-on-error: true

      - name: Check for large files
        run: |
          echo "Checking for large files in frontend..."
          find frontend -type f -size +5M -exec ls -lh {} \; | awk '{print $9 " - " $5}' || true

          if find frontend -type f -size +10M | grep -q .; then
            echo "❌ Files larger than 10MB found!"
            exit 1
          fi

      - name: Detect hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: frontend
          base: origin/main
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

      - name: GitLeaks secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # Stage 3: Dependencies
  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify package-lock.json exists
        working-directory: frontend
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "❌ package-lock.json not found"
            exit 1
          fi
          echo "✓ package-lock.json exists"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit
        working-directory: frontend
        run: |
          npm audit --json > npm-audit-report.json || true
          npm audit || true
        continue-on-error: true

      - name: Snyk dependency scan
        working-directory: frontend
        run: |
          npx snyk test --json > snyk-report.json || true
          npx snyk test || true
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: RetireJS vulnerability scan
        working-directory: frontend
        run: |
          npm install -g retire
          retire --js --node --outputformat json \
            --outputpath retire-report.json || true
          retire --js --node || true
        continue-on-error: true

      - name: Generate SBOM (CycloneDX)
        working-directory: frontend
        run: |
          npm install -g @cyclonedx/cyclonedx-npm
          cyclonedx-npm --output-file sbom.json
          echo "✓ SBOM generated"

      - name: License compliance check
        working-directory: frontend
        run: |
          npm install -g license-checker
          license-checker --json > licenses.json || true
          license-checker --summary || true

          # Check for problematic licenses
          license-checker --failOn "GPL;AGPL;LGPL" || true
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: frontend/sbom.json
          retention-days: 90

      - name: Upload dependency reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports-frontend
          path: |
            frontend/npm-audit-report.json
            frontend/snyk-report.json
            frontend/retire-report.json
            frontend/licenses.json
          retention-days: 30

  # Stage 4: Code Quality
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: |
          npm run lint -- --format json --output-file eslint-report.json || true
          npm run lint || true
        continue-on-error: true

      - name: Prettier check
        working-directory: frontend
        run: |
          npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,md}" || true
        continue-on-error: true

      - name: Complexity analysis
        working-directory: frontend
        run: |
          npm install -g complexity-report
          cr --format json \
            --output complexity-report.json \
            src/**/*.js || true
          cr src/**/*.js || true
        continue-on-error: true

      - name: TypeScript check (if applicable)
        working-directory: frontend
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit || true
          fi
        continue-on-error: true

      - name: Code duplication check
        working-directory: frontend
        run: |
          npm install -g jscpd
          jscpd src/ --format json --output ./jscpd-report.json || true
          jscpd src/ || true
        continue-on-error: true

      - name: Upload code quality reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-frontend
          path: |
            frontend/eslint-report.json
            frontend/complexity-report.json
            frontend/jscpd-report.json
          retention-days: 30

  # Stage 5: Security Scanning
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: [validate, dependency-security]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: SAST - Semgrep scan
        working-directory: frontend
        run: |
          pip install semgrep
          semgrep --config=auto \
            --json \
            --output=semgrep-report.json \
            src/ || true
          semgrep --config=auto src/ || true
        continue-on-error: true

      - name: ESLint security plugin
        working-directory: frontend
        run: |
          npm install --save-dev eslint-plugin-security
          npx eslint --plugin security \
            --format json \
            --output-file eslint-security-report.json \
            src/ || true
          npx eslint --plugin security src/ || true
        continue-on-error: true

      - name: OWASP Dependency-Check
        run: |
          wget -q https://github.com/jeremylong/DependencyCheck/releases/download/v8.4.0/dependency-check-8.4.0-release.zip
          unzip -q dependency-check-8.4.0-release.zip
          ./dependency-check/bin/dependency-check.sh \
            --project "Synapse Frontend" \
            --scan frontend \
            --format JSON \
            --format HTML \
            --out ./dependency-check-report || true
        continue-on-error: true

      - name: IaC Security - Checkov (Dockerfile & nginx)
        working-directory: frontend
        run: |
          pip install checkov
          checkov -f Dockerfile \
            --framework dockerfile \
            --output json \
            --output-file checkov-dockerfile.json || true

          checkov -f nginx.conf \
            --framework kubernetes \
            --output json \
            --output-file checkov-nginx.json || true
        continue-on-error: true

      - name: Container filesystem scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: frontend
          format: 'sarif'
          output: 'trivy-fs-frontend.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-frontend.sarif'
          category: trivy-fs-frontend
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-frontend
          path: |
            frontend/semgrep-report.json
            frontend/eslint-security-report.json
            frontend/checkov-dockerfile.json
            frontend/checkov-nginx.json
            dependency-check-report/
          retention-days: 90

  # Stage 6: Build & Test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: frontend
        run: |
          npm test -- --coverage --watchAll=false \
            --coverageReporters=json --coverageReporters=lcov \
            --coverageReporters=text
        continue-on-error: true

      - name: Coverage enforcement
        working-directory: frontend
        run: |
          echo "Checking coverage thresholds..."
          # Add your coverage requirements here
          # npm test -- --coverage --coverageThreshold='{"global":{"statements":80,"branches":80,"functions":80,"lines":80}}'
        continue-on-error: true

      - name: Build application
        working-directory: frontend
        run: npm run build
        env:
          CI: true

      - name: Bundle size check
        working-directory: frontend
        run: |
          echo "=== Build Size Analysis ==="
          du -sh build
          du -sh build/* | sort -hr | head -20

          # Check if bundle is too large (> 5MB)
          size=$(du -sm build | cut -f1)
          if [ $size -gt 5 ]; then
            echo "⚠️ Build size ($size MB) exceeds 5MB"
          else
            echo "✓ Build size acceptable: $size MB"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  # Stage 7: Container Build & Scan
  container-scan:
    name: Container Build & Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.registry }}/${{ github.repository_owner }}/synapse-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          load: true
          tags: synapse-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: synapse-frontend:test
          format: 'sarif'
          output: 'trivy-image-frontend.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-frontend.sarif'
          category: trivy-image-frontend
        continue-on-error: true

      - name: Run Trivy image scan (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: synapse-frontend:test
          format: 'json'
          output: 'trivy-image-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
        continue-on-error: true

      - name: Test container health
        run: |
          docker run -d --name test-frontend \
            -p 3000:3000 \
            synapse-frontend:test

          sleep 10

          # Test health endpoint
          curl -f http://localhost:3000/health || {
            echo "❌ Health check failed"
            docker logs test-frontend
            exit 1
          }

          curl -f http://localhost:3000/ || {
            echo "❌ Main page not loading"
            docker logs test-frontend
            exit 1
          }

          echo "✓ Container health checks passed"
          docker logs test-frontend
          docker stop test-frontend

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload container reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-reports-frontend
          path: trivy-image-report.json
          retention-days: 90

  # Performance & Accessibility
  lighthouse:
    name: Performance & Accessibility
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build application
        working-directory: frontend
        run: npm run build

      - name: Run Lighthouse CI
        working-directory: frontend
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun || true
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [validate, dependency-security, code-quality, security-scan, build-and-test, container-scan]
    if: always()
    steps:
      - name: Generate security summary
        run: |
          echo "# 🔒 Security Scan Summary - Frontend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Stages" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Validation: Commit checks, secrets detection" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependencies: npm audit, Snyk, RetireJS, SBOM" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code Quality: ESLint, Prettier, complexity analysis" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security: Semgrep, OWASP Dependency-Check, IaC scanning" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build: Unit tests, coverage, bundle size" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Container: Trivy scanning, health validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Security Tools Used" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 **Secret Detection**: TruffleHog, GitLeaks" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **Dependencies**: npm audit, Snyk, RetireJS" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 **SAST**: Semgrep, ESLint Security" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 **Container**: Trivy" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 **IaC**: Checkov" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 **SBOM**: CycloneDX" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 **Performance**: Lighthouse CI" >> $GITHUB_STEP_SUMMARY
