name: Alert Manager CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/alert-manager/**'
      - '.github/workflows/alert-manager.yml'
      - '.github/workflows/reusable-backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/alert-manager/**'
  workflow_dispatch:

jobs:
  ci-cd:
    uses: ./.github/workflows/reusable-backend-ci.yml
    with:
      service-name: alert-manager
      service-path: services/alert-manager
      port: '8004'
      python-version: '3.11'
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
