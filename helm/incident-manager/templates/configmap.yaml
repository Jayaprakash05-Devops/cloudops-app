apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "incident-manager.fullname" . }}
  labels:
    {{- include "incident-manager.labels" . | nindent 4 }}
data:
  REDIS_HOST: {{ include "incident-manager.redisHost" . | quote }}
  REDIS_PORT: {{ include "incident-manager.redisPort" . | quote }}
