apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "automation-service.fullname" . }}
  labels:
    {{- include "automation-service.labels" . | nindent 4 }}
data:
  REDIS_HOST: {{ include "automation-service.redisHost" . | quote }}
  REDIS_PORT: {{ include "automation-service.redisPort" . | quote }}
