apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metrics-collector.fullname" . }}
  labels:
    {{- include "metrics-collector.labels" . | nindent 4 }}
data:
  REDIS_HOST: {{ include "metrics-collector.redisHost" . | quote }}
  REDIS_PORT: {{ include "metrics-collector.redisPort" . | quote }}
