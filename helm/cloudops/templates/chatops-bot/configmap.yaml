{{- if .Values.chatopsBot.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudops.fullname" . }}-chatops-bot
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    {{- include "cloudops.serviceLabels" (dict "component" "chatops-bot") | nindent 4 }}
data:
  REDIS_HOST: {{ include "cloudops.redisHost" . | quote }}
  REDIS_PORT: {{ include "cloudops.redisPort" . | quote }}
{{- end }}
