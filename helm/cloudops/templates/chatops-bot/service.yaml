{{- if .Values.chatopsBot.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudops.fullname" . }}-chatops-bot
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    {{- include "cloudops.serviceLabels" (dict "component" "chatops-bot") | nindent 4 }}
  {{- with .Values.common.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.common.service.type }}
  ports:
  - port: {{ .Values.chatopsBot.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "cloudops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chatops-bot
{{- end }}
