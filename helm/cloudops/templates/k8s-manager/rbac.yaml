{{- if and .Values.k8sManager.enabled .Values.k8sManager.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloudops.fullname" . }}-k8s-manager
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    {{- include "cloudops.serviceLabels" (dict "component" "k8s-manager") | nindent 4 }}
rules:
{{- toYaml .Values.k8sManager.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cloudops.fullname" . }}-k8s-manager
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    {{- include "cloudops.serviceLabels" (dict "component" "k8s-manager") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cloudops.fullname" . }}-k8s-manager
subjects:
- kind: ServiceAccount
  name: {{ include "cloudops.serviceAccountName" . }}-k8s-manager
  namespace: {{ .Release.Namespace }}
{{- end }}
