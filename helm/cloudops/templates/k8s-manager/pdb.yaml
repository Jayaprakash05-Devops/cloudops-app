{{- if and .Values.k8sManager.enabled .Values.k8sManager.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cloudops.fullname" . }}-k8s-manager
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    {{- include "cloudops.serviceLabels" (dict "component" "k8s-manager") | nindent 4 }}
spec:
  {{- if .Values.k8sManager.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.k8sManager.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.k8sManager.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.k8sManager.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cloudops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: k8s-manager
{{- end }}
