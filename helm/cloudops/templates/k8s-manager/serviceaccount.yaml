{{- if and .Values.k8sManager.enabled .Values.k8sManager.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloudops.serviceAccountName" . }}-k8s-manager
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    {{- include "cloudops.serviceLabels" (dict "component" "k8s-manager") | nindent 4 }}
  {{- with .Values.k8sManager.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
