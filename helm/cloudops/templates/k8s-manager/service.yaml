{{- if .Values.k8sManager.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudops.fullname" . }}-k8s-manager
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    {{- include "cloudops.serviceLabels" (dict "component" "k8s-manager") | nindent 4 }}
  {{- with .Values.common.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.common.service.type }}
  ports:
  - port: {{ .Values.k8sManager.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "cloudops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-manager
{{- end }}
