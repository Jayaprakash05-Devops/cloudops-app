{{- if and .Values.authService.enabled .Values.authService.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cloudops.fullname" . }}-auth-service
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    {{- include "cloudops.serviceLabels" (dict "component" "auth-service") | nindent 4 }}
spec:
  {{- if .Values.authService.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.authService.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.authService.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.authService.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cloudops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: auth-service
{{- end }}
