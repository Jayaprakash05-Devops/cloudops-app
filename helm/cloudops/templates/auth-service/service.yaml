{{- if .Values.authService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudops.fullname" . }}-auth-service
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    {{- include "cloudops.serviceLabels" (dict "component" "auth-service") | nindent 4 }}
spec:
  type: {{ .Values.authService.service.type }}
  ports:
  - port: {{ .Values.authService.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "cloudops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
{{- end }}
